<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>SAYFLOW — say it out loud</title>

<meta name="theme-color" content="#0D1416">
<meta name="description" content="Type an English word or sentence and hear it spoken, word by word.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SAYFLOW">
<link id="mf" rel="manifest">
<link id="ati" rel="apple-touch-icon">

<style>
  :root{
    --ink:#0D1416;
    --panel:#141F23;
    --panel2:#1B282D;
    --line:#26363C;
    --sand:#EDE6D8;
    --mute:#7D949B;
    --amber:#E9B44C;
    --amber-soft:rgba(233,180,76,.15);
    --amber-edge:rgba(233,180,76,.42);

    --serif:'Iowan Old Style','Charter','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--ink);
    color:var(--sand);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  .wrap{
    max-width:820px;
    margin:0 auto;
    padding:calc(16px + env(safe-area-inset-top))
            calc(12px + env(safe-area-inset-right))
            calc(24px + env(safe-area-inset-bottom))
            calc(12px + env(safe-area-inset-left));
  }

  /* ---------- header ---------- */
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px}
  .brand{
    font-family:var(--mono);font-size:12px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--sand);font-weight:600;
  }
  .brand i{color:var(--amber);font-style:normal}
  .status{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
    color:var(--mute);text-transform:uppercase;display:flex;align-items:center;gap:6px;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--mute);flex:none}
  .dot.on{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}

  /* ---------- stage (signature) ---------- */
  .stage{
    height:104px;
    padding:8px 2px 14px;
    font-family:var(--serif);
    font-size:15px;
    line-height:1.4;
    letter-spacing:-.005em;
    display:flex;flex-wrap:wrap;align-content:flex-start;gap:2px 0;
    overflow-y:auto;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    mask-image:linear-gradient(to bottom,transparent 0,#000 8px,#000 calc(100% - 8px),transparent 100%);
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 8px,#000 calc(100% - 8px),transparent 100%);
  }
  .stage::-webkit-scrollbar{display:none}
  .w{
    display:inline-block;
    padding:1px 5px;
    margin:0 1px;
    border-radius:5px;
    color:var(--sand);
    cursor:pointer;
    transition:background .11s ease,color .11s ease,transform .11s ease;
    transform:translateY(0);
  }
  .w:active{background:var(--panel2)}
  .w.on{
    background:var(--amber-soft);
    color:var(--amber);
    transform:translateY(-1.5px);
  }
  .w.done{color:#B9AE97}
  .w.ko{
    font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
    font-size:.76em;letter-spacing:-.01em;color:#93A9B0;
  }
  .w.ko.done{color:#5F757C}
  .w.ko.on{color:var(--amber);background:var(--amber-soft)}
  .sep{
    display:inline-block;padding:1px 4px;color:#3E5158;
    font-family:var(--mono);font-size:.5em;vertical-align:middle;user-select:none;
  }
  .brk{flex-basis:100%;height:9px}
  .empty{
    font-family:var(--serif);font-size:14px;font-style:italic;
    color:#3E5158;line-height:1.5;padding:2px 0;
  }
  .meter{height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:22px}
  .meter b{display:block;height:100%;width:0;background:var(--amber);transition:width .14s linear}

  /* ---------- input ---------- */
  .field{position:relative;margin-bottom:14px}
  textarea{
    width:100%;min-height:88px;resize:none;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:13px 14px 30px;
    color:var(--sand);
    font-family:var(--sans);font-size:16px;line-height:1.45;
    outline:none;
    transition:border-color .15s ease;
  }
  textarea::placeholder{color:#4C6169}
  textarea:focus{border-color:var(--amber-edge)}
  .count{
    position:absolute;right:12px;bottom:9px;
    font-family:var(--mono);font-size:10.5px;color:#4C6169;pointer-events:none;
  }

  /* ---------- controls ---------- */
  .row{display:flex;gap:9px;align-items:center}
  .row + .row{margin-top:12px}

  .speak{
    flex:1;height:54px;border:none;border-radius:13px;
    background:var(--amber);color:#161009;
    font-family:var(--sans);font-size:16.5px;font-weight:650;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    cursor:pointer;transition:filter .12s ease,transform .08s ease;
  }
  .speak:active{transform:scale(.985);filter:brightness(.93)}
  .speak:disabled{background:var(--panel2);color:#4C6169;cursor:default}
  .speak svg{flex:none}

  .icon{
    width:54px;height:54px;flex:none;
    background:var(--panel);border:1px solid var(--line);border-radius:13px;
    color:var(--mute);display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:color .12s ease,border-color .12s ease;
  }
  .icon:active{border-color:var(--amber-edge);color:var(--amber)}
  .icon:disabled{opacity:.4;cursor:default}

  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
  .seg button{
    flex:1;height:34px;border:none;background:none;border-radius:8px;
    font-family:var(--mono);font-size:12px;color:var(--mute);cursor:pointer;
    transition:background .12s ease,color .12s ease;
  }
  .seg button.on{background:var(--panel2);color:var(--amber)}

  .ctl{
    background:var(--panel);border:1px solid var(--line);border-radius:11px;
    padding:10px 13px;flex:1;min-width:0;
  }
  .ctl .lab{
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--mute);display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;
  }
  .ctl .lab b{color:var(--amber);font-weight:600;letter-spacing:.04em;font-size:11.5px}

  /* speak / stop / speed / repeat as four equal columns on one line */
  .row.bar{align-items:stretch}
  .row.bar > *{flex:1;min-width:0}
  .row.bar .speak{height:58px;font-size:13px;padding:0 2px;gap:5px}
  .row.bar .speak svg{width:12px;height:12px}
  .row.bar .icon{width:auto;height:58px}
  .ctl.compact{padding:7px 9px;height:58px;display:flex;flex-direction:column;justify-content:center}
  .ctl.compact .lab{margin-bottom:5px;font-size:8.5px}
  .ctl.compact .lab b{font-size:10px}
  .ctl.compact .seg{padding:2px}
  .ctl.compact .seg button{
    height:24px;font-size:9.5px;padding:0 2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .ctl.compact select{font-size:12px}

  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:16px;background:none;margin:0;display:block;
  }
  input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line);border-radius:3px}
  input[type=range]::-moz-range-track{height:3px;background:var(--line);border-radius:3px}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:17px;height:17px;border-radius:50%;
    background:var(--amber);margin-top:-7px;border:none;
  }
  input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--amber);border:none}

  select{
    -webkit-appearance:none;appearance:none;width:100%;
    background:transparent;border:none;outline:none;
    color:var(--sand);font-family:var(--sans);font-size:14.5px;
    padding:0 18px 0 0;margin:0;
    background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);
    background-position:calc(100% - 6px) 8px,calc(100% - 2px) 8px;
    background-size:4px 4px,4px 4px;background-repeat:no-repeat;
    text-overflow:ellipsis;cursor:pointer;
  }
  select option{background:var(--panel2);color:var(--sand)}

  /* ---------- recent ---------- */
  .recent{margin-top:26px}
  .rhead{
    font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--mute);display:flex;justify-content:space-between;align-items:center;
    padding-bottom:9px;border-bottom:1px solid var(--line);
  }
  .rhead button{
    background:none;border:none;color:#4C6169;font-family:var(--mono);
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:0;
  }
  .ritem{
    display:flex;align-items:center;gap:10px;
    padding:12px 0;border-bottom:1px solid var(--line);
  }
  .ritem span{
    flex:1;min-width:0;font-family:var(--serif);font-size:16px;color:#C6BCA8;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;
  }
  .ritem:active span{color:var(--amber)}
  .ritem button{
    flex:none;width:26px;height:26px;border:none;background:none;color:#3E5158;
    font-size:15px;line-height:1;cursor:pointer;border-radius:6px;
  }
  .rempty{font-size:13.5px;color:#4C6169;padding:14px 0}

  .foot{
    margin-top:26px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    color:#3E5158;text-transform:uppercase;display:flex;justify-content:space-between;gap:10px;
  }
  .install{
    background:none;border:1px solid var(--line);border-radius:7px;color:var(--mute);
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    padding:4px 9px;cursor:pointer;display:none;
  }
  .install.show{display:block}

  .warn{
    background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--amber);
    border-radius:9px;padding:12px 14px;font-size:13.5px;color:var(--mute);
    margin-bottom:16px;display:none;
  }
  .warn.show{display:block}

  :focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  @media (max-width:380px){
    .wrap{
      padding-left:calc(9px + env(safe-area-inset-left));
      padding-right:calc(9px + env(safe-area-inset-right));
    }
    .stage{font-size:13px;height:88px}
    .row.bar{gap:6px}
    .row.bar .speak{font-size:11px;gap:3px;padding:0}
    .row.bar .speak svg{width:11px;height:11px}
    .ctl.compact{padding:6px 6px}
    .ctl.compact .lab{font-size:7.5px;margin-bottom:4px}
    .ctl.compact .lab b{font-size:9px}
    .ctl.compact .seg button{font-size:9px;height:22px}
    .ctl.compact select{font-size:10.5px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">SAY<i>FLOW</i></div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">ready</span></div>
  </div>

  <div class="warn" id="warn">This browser doesn't support speech synthesis. Try Safari, Chrome, or Edge.</div>

  <div class="stage" id="stage"></div>
  <div class="meter"><b id="meter"></b></div>

  <div class="field">
    <textarea id="text" rows="3" autocapitalize="sentences" autocomplete="off" spellcheck="false"
      placeholder="Could you say that again? / 다시 말씀해 주시겠어요?"></textarea>
    <div class="count" id="count">0</div>
  </div>

  <div class="row bar">
    <button class="speak" id="speak">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3 6h2.4L9 2.6v10.8L5.4 10H3a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z"/><path d="M11.2 5.1a.8.8 0 0 1 1.1.1A4.2 4.2 0 0 1 13.4 8a4.2 4.2 0 0 1-1.1 2.8.8.8 0 1 1-1.2-1 2.6 2.6 0 0 0 .7-1.8 2.6 2.6 0 0 0-.7-1.8.8.8 0 0 1 .1-1.1z"/></svg>
      <span id="speakLabel">Speak</span>
    </button>
    <button class="icon" id="stop" title="Stop" disabled aria-label="Stop">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="3" width="10" height="10" rx="2"/></svg>
    </button>
    <div class="ctl compact">
      <div class="lab"><span>Speed</span><b id="rateVal">1.00×</b></div>
      <input type="range" id="rate" min="0.5" max="1.5" step="0.05" value="1">
    </div>
    <div class="ctl compact">
      <div class="lab"><span>Repeat</span></div>
      <div class="seg" id="rep" style="border:none;background:none;padding:0">
        <button data-n="1" class="on">1×</button>
        <button data-n="2">2×</button>
        <button data-n="inf">∞</button>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="ctl compact" id="orderRow" style="display:none">
      <div class="lab"><span>Order</span><b id="orderNote"></b></div>
      <div class="seg" id="order" style="border:none;background:none;padding:0">
        <button data-o="en-ko" class="on">EN → 한국어</button>
        <button data-o="ko-en">한국어 → EN</button>
      </div>
    </div>
    <div class="ctl compact">
      <div class="lab"><span>English voice</span><b id="vlang">—</b></div>
      <select id="voice"><option>Loading…</option></select>
    </div>
    <div class="ctl compact" id="kvoiceRow" style="display:none">
      <div class="lab"><span>Korean voice</span><b id="klang">—</b></div>
      <select id="kvoice"></select>
    </div>
  </div>

  <div class="recent">
    <div class="rhead"><span>Recent</span><button id="clear">Clear</button></div>
    <div id="rlist"><div class="rempty">Sentences you speak will collect here.</div></div>
  </div>

  <div class="foot">
    <span id="hint">tap any word to hear it alone</span>
    <button class="install" id="install">Install</button>
  </div>

</div>

<script>
(function(){
'use strict';

const synth = window.speechSynthesis;
const $ = id => document.getElementById(id);
const stageEl=$('stage'), meterEl=$('meter'), textEl=$('text'), countEl=$('count'),
      speakBtn=$('speak'), speakLabel=$('speakLabel'), stopBtn=$('stop'),
      rateEl=$('rate'), rateVal=$('rateVal'), repEl=$('rep'), voiceEl=$('voice'),
      vlangEl=$('vlang'), rlistEl=$('rlist'), dotEl=$('dot'), statusEl=$('statusText'),
      kvoiceEl=$('kvoice'), klangEl=$('klang'), kvoiceRow=$('kvoiceRow'),
      orderRow=$('orderRow'), orderEl=$('order'), orderNote=$('orderNote');

if(!synth){ $('warn').classList.add('show'); speakBtn.disabled = true; }

/* ---------- storage (falls back to memory if blocked) ---------- */
const store = (function(){
  let ok = true;
  try { localStorage.setItem('__sf','1'); localStorage.removeItem('__sf'); } catch(e){ ok = false; }
  const mem = {};
  return {
    get(k,d){ try{ const v = ok ? localStorage.getItem(k) : mem[k]; return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
    set(k,v){ try{ const s = JSON.stringify(v); if(ok) localStorage.setItem(k,s); else mem[k]=s; }catch(e){} }
  };
})();

/* ---------- state ---------- */
let tokens = [];        // {w, start, end, lang, seg, sep, brk}
let segments = [];      // {lang, lo, hi, line, text}
let voices = [];
let koVoices = [];
let hasKo = false, hasEn = false;
let rate = store.get('rate', 1);
let repeat = store.get('repeat', 1);
let order = store.get('order', 'en-ko');
let history = store.get('history', []);
let remaining = 0;
let gotBoundary = false;
let unlocked = false;
let playToken = 0;   // bumped on every stop/new speak so stale timeouts can't resurrect playback

const ua = navigator.userAgent;
const isApple = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && /Safari/.test(ua) && !/Chrome|Chromium|Edg/.test(ua));

/* ---------- iOS audio unlock: first gesture must contain a speak() ---------- */
function unlock(){
  if(unlocked || !synth) return;
  unlocked = true;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; synth.speak(u); } catch(e){}
}
document.addEventListener('touchend', unlock, {passive:true, once:true});
document.addEventListener('mousedown', unlock, {once:true});

/* ---------- tokenize → language segments → stage ---------- */
const RE_HANGUL = /[\u3131-\u318E\uAC00-\uD7A3]/g;
const RE_LATIN  = /[A-Za-z]/g;
const SEPARATORS = ['/','|','=','—','–','→','::',':','-','·'];

function langOfWord(w){
  const k = (w.match(RE_HANGUL) || []).length;
  const e = (w.match(RE_LATIN) || []).length;
  if(k > e) return 'ko';
  if(e > k) return 'en';
  return null;                     // digits, punctuation — inherit neighbours
}

function tokenize(t){
  const out = [], re = /\S+/g; let m, prevEnd = 0;
  while((m = re.exec(t))){
    const tok = { w:m[0], start:m.index, end:m.index + m[0].length };
    tok.brk = out.length > 0 && t.slice(prevEnd, m.index).includes('\n');
    tok.sep = SEPARATORS.indexOf(m[0]) !== -1;
    tok.lang = tok.sep ? null : langOfWord(m[0]);
    prevEnd = tok.end;
    out.push(tok);
  }
  return out;
}

/* Group consecutive same-language words. A separator or a newline forces a break. */
function buildSegments(raw){
  segments = [];
  let cur = null, line = 0;
  tokens.forEach((t,i) => {
    if(t.brk){ line++; cur = null; }
    if(t.sep){ cur = null; t.seg = -1; return; }

    let L = t.lang || (cur && cur.lang);
    if(!L){                                    // leading digits/punctuation: look ahead
      for(let j = i + 1; j < tokens.length; j++){
        if(tokens[j].sep || tokens[j].brk) break;
        if(tokens[j].lang){ L = tokens[j].lang; break; }
      }
      L = L || 'en';
    }
    if(!cur || cur.lang !== L){
      cur = { lang:L, lo:i, hi:i+1, line:line };
      segments.push(cur);
    } else cur.hi = i + 1;
    t.lang = L;
    t.seg = segments.length - 1;
  });
  segments.forEach(s => { s.text = raw.slice(tokens[s.lo].start, tokens[s.hi-1].end); });
  hasKo = segments.some(s => s.lang === 'ko');
  hasEn = segments.some(s => s.lang === 'en');
  updateModeUI();
}

function renderStage(){
  const t = textEl.value;
  tokens = tokenize(t);
  buildSegments(t);
  countEl.textContent = t.length;
  stageEl.innerHTML = '';
  stageEl.scrollTop = 0;
  if(!tokens.length){
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = 'Type an English word or sentence — add the Korean after it.';
    stageEl.appendChild(d);
    meterEl.style.width = '0';
    return;
  }
  tokens.forEach((tok,i) => {
    if(tok.brk){
      const b = document.createElement('div'); b.className = 'brk';
      stageEl.appendChild(b);
    }
    const s = document.createElement('span');
    s.className = tok.sep ? 'sep' : ('w' + (tok.lang === 'ko' ? ' ko' : ''));
    if(!tok.sep) s.dataset.i = i;
    s.textContent = tok.w;
    stageEl.appendChild(s);
    stageEl.appendChild(document.createTextNode(' '));
  });
  meterEl.style.width = '0';
}

/* Pair controls only appear once there is actually Korean in the text. */
function updateModeUI(){
  const pair = hasKo && hasEn;
  if(orderRow) orderRow.style.display = pair ? 'block' : 'none';
  if(kvoiceRow) kvoiceRow.style.display = hasKo ? 'block' : 'none';
  if(orderNote) orderNote.textContent = hasKo && !koVoices.length ? 'no Korean voice' : '';
}

function setActive(i){
  let activeEl = null;
  stageEl.querySelectorAll('.w').forEach(el => {
    const k = +el.dataset.i;
    const on = k === i;
    el.classList.toggle('on', on);
    el.classList.toggle('done', k < i);
    if(on) activeEl = el;
  });
  if(tokens.length) meterEl.style.width = ((i+1)/tokens.length*100) + '%';
  if(activeEl) scrollToActive(activeEl);
}

/* Keep only the word being spoken in view — the stage window scrolls, it doesn't expand.
   Measured via getBoundingClientRect (not offsetTop) so it centers correctly regardless
   of which ancestor ends up as the offsetParent. */
function scrollToActive(el){
  const stageRect = stageEl.getBoundingClientRect();
  const elRect = el.getBoundingClientRect();
  const delta = (elRect.top + elRect.height/2) - (stageRect.top + stageRect.height/2);
  const max = stageEl.scrollHeight - stageEl.clientHeight;
  stageEl.scrollTop = Math.max(0, Math.min(stageEl.scrollTop + delta, max));
}

function clearActive(){
  stageEl.querySelectorAll('.w').forEach(el => el.classList.remove('on','done'));
  meterEl.style.width = '0';
  stageEl.scrollTop = 0;
}

/* ---------- word clock ----------
   A running clock drives the highlight instead of pre-set timers, so it can be
   corrected mid-sentence. Real boundary events snap its phase and adjust its
   speed; when they never arrive (iOS), the learned pace carries it alone.      */

const LEAD = 0.07;          // light each word this many seconds early
let plan = [];              // per-word start, in "seconds at rate 1.0"
let totalUnits = 0;
let unitsPerSec = 1;
let clockStart = 0;         // phase origin, adjusted by resync
let speechT0 = 0;           // true onstart time, never adjusted — used to learn
let lastIdx = -1;
let rafId = null;
let clockOn = false;
let segLo = 0, segHi = 0, segChar0 = 0, segVoiceKey = 'default';

function syllables(w){
  const h = (w.match(/[\uAC00-\uD7A3]/g) || []).length;
  if(h) return h;                                   // Hangul: one block = one syllable
  w = w.toLowerCase().replace(/[^a-z]/g,'');
  if(!w) return 1;
  const m = w.replace(/e$/,'').match(/[aeiouy]+/g);
  return Math.max(1, m ? m.length : 1);
}

function buildPlan(lo, hi){
  plan = []; let acc = 0;
  for(let i = lo; i < hi; i++){
    plan.push(acc);
    acc += 0.175 * syllables(tokens[i].w) + 0.10;
    if(/[.,!?;:—]$/.test(tokens[i].w)) acc += 0.18;
  }
  totalUnits = acc;
}

/* paceMul: how much slower this voice actually is than the model. 1 = spot on. */
function paceMul(){
  const cal = store.get('pace', {});
  const m = cal[segVoiceKey];
  return (m && m > 0.4 && m < 2.5) ? m : 1;
}
function learnPace(actualSec){
  if(!(actualSec > 0.35) || totalUnits < 0.6) return;
  const observed = totalUnits / actualSec;      // units per second
  const m = rate / observed;
  if(!(m > 0.4 && m < 2.5)) return;
  const cal = store.get('pace', {});
  const k = segVoiceKey;
  cal[k] = cal[k] ? cal[k] * 0.6 + m * 0.4 : m;
  store.set('pace', cal);
}

function idxForUnits(u){
  for(let k = plan.length - 1; k >= 0; k--) if(u >= plan[k]) return segLo + k;
  return segLo;
}
function indexFromChar(ci){
  const abs = segChar0 + ci;
  for(let i = segHi - 1; i >= segLo; i--) if(abs >= tokens[i].start) return i;
  return segLo;
}

function startClock(lo, hi, char0, vkey){
  stopClock();
  segLo = lo; segHi = hi; segChar0 = char0; segVoiceKey = vkey || 'default';
  buildPlan(lo, hi);
  unitsPerSec = rate / paceMul();
  speechT0 = clockStart = performance.now();
  lastIdx = -1;
  clockOn = true;
  tick();
}
function tick(){
  if(!clockOn) return;
  const u = ((performance.now() - clockStart) / 1000 + LEAD) * unitsPerSec;
  const i = Math.min(idxForUnits(u), segHi - 1);
  if(i !== lastIdx){ lastIdx = i; setActive(i); }
  if(u < totalUnits) rafId = requestAnimationFrame(tick);
}
function stopClock(){
  clockOn = false;
  if(rafId) cancelAnimationFrame(rafId);
  rafId = null;
}

/* A boundary event is ground truth: correct the speed, then snap the phase. */
function resync(charIndex){
  const i = indexFromChar(charIndex);
  const p = plan[i - segLo];
  if(p == null) return;
  const now = performance.now();
  const elapsed = (now - speechT0) / 1000;
  if(elapsed > 0.45 && p > 0.8){
    const observed = p / elapsed;
    if(observed > 0.3 && observed < 4) unitsPerSec = unitsPerSec * 0.4 + observed * 0.6;
  }
  clockStart = now - (p / unitsPerSec - LEAD) * 1000;
  if(i !== lastIdx){ lastIdx = i; setActive(i); }
  if(!clockOn){ clockOn = true; tick(); }
}

/* ---------- voices ---------- */
function loadVoices(){
  if(!synth) return;
  const all = synth.getVoices();
  if(!all.length) return;
  const en = all.filter(v => /^en/i.test(v.lang));
  voices = (en.length ? en : all).sort((a,b) =>
    (b.localService - a.localService) || a.lang.localeCompare(b.lang) || a.name.localeCompare(b.name));

  const saved = store.get('voice', null);
  voiceEl.innerHTML = '';
  voices.forEach(v => {
    const o = document.createElement('option');
    o.value = v.voiceURI;
    o.textContent = v.name + (v.localService ? '' : ' · online');
    voiceEl.appendChild(o);
  });
  const pick = voices.find(v => v.voiceURI === saved)
            || voices.find(v => v.localService && /en[-_]US/i.test(v.lang))
            || voices.find(v => v.localService)
            || voices[0];
  if(pick){ voiceEl.value = pick.voiceURI; vlangEl.textContent = pick.lang.replace('_','-'); }

  koVoices = all.filter(v => /^ko/i.test(v.lang)).sort((a,b) => (b.localService - a.localService));
  const ksaved = store.get('kvoice', null);
  kvoiceEl.innerHTML = '';
  koVoices.forEach(v => {
    const o = document.createElement('option');
    o.value = v.voiceURI;
    o.textContent = v.name + (v.localService ? '' : ' · online');
    kvoiceEl.appendChild(o);
  });
  const kpick = koVoices.find(v => v.voiceURI === ksaved) || koVoices[0];
  if(kpick){ kvoiceEl.value = kpick.voiceURI; klangEl.textContent = kpick.lang.replace('_','-'); }
  else { klangEl.textContent = 'none'; }
  updateModeUI();
}
if(synth){
  loadVoices();
  synth.onvoiceschanged = loadVoices;
  [120, 400, 1000, 2200].forEach(ms => setTimeout(loadVoices, ms)); // iOS populates late
}
function currentVoice(lang){
  if(lang === 'ko') return koVoices.find(v => v.voiceURI === kvoiceEl.value) || koVoices[0] || null;
  return voices.find(v => v.voiceURI === voiceEl.value) || null;
}
function voiceKey(lang){
  const v = currentVoice(lang);
  return v ? v.voiceURI : (lang === 'ko' ? 'ko-default' : 'en-default');
}

/* ---------- speaking ---------- */
function setBusy(on){
  dotEl.classList.toggle('on', on);
  statusEl.textContent = on ? 'speaking' : 'ready';
  stopBtn.disabled = !on;
  speakLabel.textContent = on ? 'Speaking…' : 'Speak';
}

function utter(str, lang){
  const u = new SpeechSynthesisUtterance(str);
  const v = currentVoice(lang);
  if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = lang === 'ko' ? 'ko-KR' : 'en-US'; }
  u.rate = rate; u.pitch = 1; u.volume = 1;
  return u;
}

function speakNow(str, lang, clock, onDone){
  const u = utter(str, lang);
  gotBoundary = false;

  u.onstart = () => {
    setBusy(true);
    if(clock) startClock(clock.lo, clock.hi, clock.char0, voiceKey(lang));
  };
  u.onboundary = (e) => {
    if(!clock) return;
    if(e.name && e.name !== 'word') return;
    gotBoundary = true;
    resync(e.charIndex);
  };
  u.onend = () => {
    if(clock){
      learnPace((performance.now() - speechT0) / 1000);
      stopClock();
    }
    onDone && onDone();
  };
  u.onerror = () => { stopClock(); setBusy(false); clearActive(); };

  synth.cancel();
  // Safari drops an utterance queued in the same tick as cancel()
  setTimeout(() => synth.speak(u), 80);
}

/* Order the segments for playback: within each line, EN→KO or KO→EN. */
function buildSequence(){
  const byLine = [];
  segments.forEach((s,i) => {
    if(!byLine[s.line]) byLine[s.line] = [];
    byLine[s.line].push(i);
  });
  const seq = [];
  byLine.forEach(group => {
    if(!group) return;
    let g = group.slice();
    if(order === 'ko-en'){
      const ko = g.filter(i => segments[i].lang === 'ko');
      const en = g.filter(i => segments[i].lang === 'en');
      g = ko.concat(en);
    }
    g.forEach(i => { if(speakable(segments[i])) seq.push(i); });
  });
  return seq;
}
function speakable(s){
  if(s.lang === 'ko' && !koVoices.length) return false;   // device has no Korean voice
  return true;
}

function speakSentence(){
  if(!synth) return;
  const t = textEl.value.trim();
  if(!t) { textEl.focus(); return; }
  unlock();
  renderStage();
  const seq = buildSequence();
  if(!seq.length) return;
  pushHistory(t);
  remaining = repeat === 'inf' ? Infinity : repeat;

  const token = ++playToken;   // invalidates any earlier speak/repeat chain still in flight
  let pos = 0;
  const step = () => {
    if(token !== playToken) return;
    if(pos >= seq.length){
      remaining--;
      if(remaining > 0){ pos = 0; setTimeout(() => { if(token === playToken){ clearActive(); step(); } }, 620); }
      else { setBusy(false); setTimeout(() => { if(token === playToken) clearActive(); }, 700); }
      return;
    }
    const s = segments[seq[pos]];
    const next = segments[seq[pos + 1]];
    const gap = !next ? 0 : (next.line !== s.line ? 620 : 340);  // longer pause between pairs
    speakNow(s.text, s.lang, { lo:s.lo, hi:s.hi, char0:tokens[s.lo].start }, () => {
      if(token !== playToken) return;
      pos++;
      setTimeout(() => { if(token === playToken) step(); }, gap);
    });
  };
  step();
}

function speakWord(i){
  if(!synth || !tokens[i] || tokens[i].sep) return;
  unlock();
  stopAll(true);
  const lang = tokens[i].lang || 'en';
  if(lang === 'ko' && !koVoices.length) return;
  const els = stageEl.querySelectorAll('.w');
  els.forEach(el => { el.classList.remove('done'); el.classList.toggle('on', +el.dataset.i === i); });
  const clean = tokens[i].w.replace(/^[^\w'’\u3131-\uD7A3-]+|[^\w'’\u3131-\uD7A3-]+$/g,'') || tokens[i].w;
  speakNow(clean, lang, null, () => {
    setBusy(false);
    setTimeout(() => { els.forEach(el => el.classList.remove('on')); }, 450);
  });
}

function stopAll(quiet){
  playToken++;   // invalidate any pending repeat/gap timeouts, including an infinite loop
  stopClock();
  remaining = 0;
  if(synth) synth.cancel();
  setBusy(false);
  if(!quiet) clearActive();
}

/* keep long text alive in Chrome (its engine stalls near 15s) */
if(synth && !isApple){
  setInterval(() => {
    if(synth.speaking && !synth.paused){ synth.pause(); synth.resume(); }
  }, 9500);
}

/* ---------- history ---------- */
function pushHistory(t){
  history = history.filter(x => x !== t);
  history.unshift(t);
  if(history.length > 14) history.length = 14;
  store.set('history', history);
  renderHistory();
}
function renderHistory(){
  rlistEl.innerHTML = '';
  if(!history.length){
    rlistEl.innerHTML = '<div class="rempty">Sentences you speak will collect here.</div>';
    return;
  }
  history.forEach((t,i) => {
    const row = document.createElement('div'); row.className = 'ritem';
    const s = document.createElement('span'); s.textContent = t;
    s.onclick = () => { textEl.value = t; renderStage(); speakSentence(); window.scrollTo({top:0,behavior:'smooth'}); };
    const sh = document.createElement('button'); sh.innerHTML = shareIconSVG; sh.setAttribute('aria-label','Share');
    sh.onclick = (e) => { e.stopPropagation(); shareText(t, sh); };
    const x = document.createElement('button'); x.textContent = '×'; x.setAttribute('aria-label','Remove');
    x.onclick = () => { history.splice(i,1); store.set('history', history); renderHistory(); };
    row.append(s,sh,x); rlistEl.appendChild(row);
  });
}

/* ---------- sharing a saved sentence to another device ---------- */
const shareIconSVG = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10V2M8 2L5.2 4.8M8 2l2.8 2.8"/><path d="M3.5 7.5V13a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5V7.5"/></svg>';

/* base64url of the UTF-8 bytes — ~4/3 expansion vs. encodeURIComponent's ~3x for Korean text,
   so a Korean sentence doesn't blow the URL past what AirDrop/share-sheet "open URL" handlers allow. */
function encodeText(t){
  const bytes = new TextEncoder().encode(t);
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeText(b){
  let s = b.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length % 4) s += '=';
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* A deep link only means anything if this page itself lives at a real, stable http(s) address —
   a file:// path is specific to this device and can't resolve on whoever receives the AirDrop. */
function canDeepLink(){
  return /^https?:$/.test(location.protocol);
}

function shareLink(t){
  const url = new URL(location.href);
  url.search = ''; url.hash = '';
  url.searchParams.set('b', encodeText(t));
  return url.toString();
}

/* Historically, "open this URL" handlers (AirDrop, share sheets, some OS intents) reject/mangle
   anything past a couple thousand characters — a long link throws "URI Too Long" instead of sharing.
   Stay well under that and just share the sentence as plain text once a link risks tripping it. */
const MAX_LINK_LEN = 1500;

async function shareText(t, btn){
  const link = canDeepLink() ? shareLink(t) : null;
  const useLink = !!link && link.length <= MAX_LINK_LEN;
  const payload = useLink ? { title:'SAYFLOW', text:t, url:link } : { title:'SAYFLOW', text:t };
  if(navigator.share){
    try { await navigator.share(payload); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }   // user cancelled the sheet — don't fall through to clipboard
  }
  try {
    await navigator.clipboard.writeText(useLink ? link : t);
    flashLabel(btn, '✓');
  } catch(e){
    flashLabel(btn, '✕');
  }
}
function flashLabel(btn, mark){
  if(!btn) return;
  const prev = btn.innerHTML;
  btn.innerHTML = mark;
  setTimeout(() => { btn.innerHTML = prev; }, 1100);
}

/* ---------- wiring ---------- */
textEl.addEventListener('input', renderStage);
stageEl.addEventListener('click', e => {
  const el = e.target.closest('.w');
  if(el) speakWord(+el.dataset.i);
});
speakBtn.addEventListener('click', speakSentence);
stopBtn.addEventListener('click', () => stopAll(false));

rateEl.value = rate;
rateVal.textContent = Number(rate).toFixed(2) + '×';
rateEl.addEventListener('input', () => {
  rate = parseFloat(rateEl.value);
  rateVal.textContent = rate.toFixed(2) + '×';
  store.set('rate', rate);
});
rateVal.addEventListener('click', () => {
  rate = 1; rateEl.value = 1; rateVal.textContent = '1.00×'; store.set('rate', 1);
});

repEl.querySelectorAll('button').forEach(b => {
  const val = b.dataset.n === 'inf' ? 'inf' : +b.dataset.n;
  if(val === repeat) { repEl.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); }
  b.addEventListener('click', () => {
    repeat = val;
    store.set('repeat', repeat);
    repEl.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  });
});

orderEl.querySelectorAll('button').forEach(b => {
  if(b.dataset.o === order){ orderEl.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); }
  b.addEventListener('click', () => {
    order = b.dataset.o;
    store.set('order', order);
    orderEl.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  });
});

voiceEl.addEventListener('change', () => {
  store.set('voice', voiceEl.value);
  const v = currentVoice('en');
  if(v) vlangEl.textContent = v.lang.replace('_','-');
});

kvoiceEl.addEventListener('change', () => {
  store.set('kvoice', kvoiceEl.value);
  const v = currentVoice('ko');
  if(v) klangEl.textContent = v.lang.replace('_','-');
});

$('clear').addEventListener('click', () => { history = []; store.set('history', history); renderHistory(); });

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ stopAll(false); }
  if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); speakSentence(); }
});
document.addEventListener('visibilitychange', () => { if(document.hidden) stopAll(false); });
window.addEventListener('pagehide', () => { if(synth) synth.cancel(); });

if(!('ontouchstart' in window)) $('hint').textContent = '⌘↵ speak · esc stop · click a word';

/* ---------- PWA: inline manifest + generated icons ---------- */
function makeIcon(size){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  x.fillStyle = '#0D1416'; x.fillRect(0,0,size,size);
  const cx = size*0.33, cy = size*0.5;
  x.fillStyle = '#EDE6D8';
  x.beginPath(); x.arc(cx, cy, size*0.085, 0, Math.PI*2); x.fill();
  x.strokeStyle = '#E9B44C'; x.lineCap = 'round'; x.lineWidth = size*0.07;
  [0.17,0.275,0.38].forEach((r,i) => {
    x.globalAlpha = 1 - i*0.3;
    x.beginPath(); x.arc(cx, cy, size*r, -0.82, 0.82); x.stroke();
  });
  return c.toDataURL('image/png');
}
try{
  const i192 = makeIcon(192), i512 = makeIcon(512);
  $('ati').href = makeIcon(180);
  const mfJSON = {
    name:'SAYFLOW', short_name:'SAYFLOW',
    description:'Type an English word or sentence and hear it spoken, word by word.',
    start_url:'./', scope:'./', display:'standalone', orientation:'portrait',
    background_color:'#0D1416', theme_color:'#0D1416', lang:'en',
    icons:[
      {src:i192, sizes:'192x192', type:'image/png', purpose:'any'},
      {src:i512, sizes:'512x512', type:'image/png', purpose:'any'},
      {src:i512, sizes:'512x512', type:'image/png', purpose:'maskable'}
    ]
  };
  $('mf').href = URL.createObjectURL(new Blob([JSON.stringify(mfJSON)], {type:'application/manifest+json'}));
}catch(e){}

let deferred = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferred = e; $('install').classList.add('show');
});
$('install').addEventListener('click', async () => {
  if(!deferred) return;
  deferred.prompt(); await deferred.userChoice;
  deferred = null; $('install').classList.remove('show');
});

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

/* ---------- boot ---------- */
/* A shared link (?b=...) takes priority over the last-typed text, then gets cleaned from the URL. */
function readSharedText(){
  const params = new URL(location.href).searchParams;
  const b = params.get('b');
  if(b != null){ try { return decodeText(b); } catch(e){ return null; } }
  return params.get('t');   // legacy plain-text param, in case an old link is still floating around
}
const sharedText = readSharedText();
textEl.value = sharedText != null ? sharedText : store.get('last', '');
if(sharedText != null){
  store.set('last', sharedText);
  window.history.replaceState(null, '', location.pathname);   // note: window.history — the local `history` var is the Recent-list array
}
renderStage();
renderHistory();
textEl.addEventListener('input', () => store.set('last', textEl.value));

})();
</script>
